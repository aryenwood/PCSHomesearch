[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Internal docs live in docs/ but publish dir is the repo root —
# force-404 them so they are never served publicly.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# Build and QA tooling lives in tools/ — never served either.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

# The shared stylesheet and script are kept for 10 minutes, so a family reading several pages
# does not wait on a "still the same?" check before every page can paint (Oct 28, "feels sluggish").
# A change still reaches them within 10 minutes; pages themselves are always checked.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=600"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
