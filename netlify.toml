[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Internal docs live in docs/ but publish dir is the repo root —
# force-404 them so they are never served publicly.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
